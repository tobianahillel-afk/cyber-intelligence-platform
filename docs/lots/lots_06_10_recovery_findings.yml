  - id: R02-F10
    historical_lot: 10
    historical_issue: 29
    capability: durable_backfill_crash_partial_progress_and_circuit_recovery
    severity: critical
    status: recovery_local
    owner: R02-L07
    evidence:
      - BackfillPartitionRecord has state cursor attempts and timestamps but no lease owner lease expiry or retry availability timestamp
      - claim_backfill_partition changes PENDING or FAILED to RUNNING and no stale RUNNING recovery is present
      - backfill worker catches AdapterPartialExecutionError through AdapterExecutionError and discards its partial batch/checkpoint
      - FAILED backfill partitions are immediately reclaimable without the incremental collection circuit/backoff path
    invariant: >-
      Backfill work is durably owned, crash-recoverable, partially resumable and provider-safe: stale RUNNING work is
      recoverable, partial progress is atomically checkpointed, retries are backed off/circuit-gated, and concurrent
      workers or pause/disable/revoke races cannot corrupt progress.
    terminal_disposition: null

