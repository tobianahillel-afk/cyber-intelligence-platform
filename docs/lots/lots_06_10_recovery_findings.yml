  - id: R02-F07
    historical_lot: 7
    historical_issue: 23
    related_historical_issue: 25
    capability: public_ats_projection_requires_resolved_organization_identity
    severity: high
    status: recovery_local
    owner: R02-L02
    evidence:
      - Greenhouse, Lever and SmartRecruiters registries accept local id/token-or-identifier/canonical_name/country/enabled but no resolved organization binding
      - their mappers pass the registry id as CanonicalPublicJob.organization_key
      - CanonicalPublicJob derives organization_id deterministically from organization_key and map_canonical_public_job constructs an Organization from that configured name/key
      - persist_commercial_projections upserts projection.organization before evidence/signal persistence and opportunity generation
      - tests/integration/test_greenhouse_commercial_projection.py proves that a registry-derived Example Security organization is created by this path without a Lot08 identity-resolution decision
    invariant: >-
      An ATS site/board/company configuration may identify a provider tenant, but it cannot implicitly mint or
      assert canonical legal organization identity. Public-job commercial projection must bind to an existing
      resolved canonical organization or to an explicit evidence-backed/reviewed identity decision before
      organization-scoped commercial aggregation and cross-provider deduplication. Provider-native provenance
      remains independent and no fuzzy/name-only automatic identity merge is introduced.
    terminal_disposition: null

  - id: R02-F08
    historical_lot: 10
    historical_issue: 29
    related_historical_issue: 27
    capability: provider_onboarding_runtime_execution_authority_convergence
    severity: critical
    status: recovery_local
    owner: R02-L05
    evidence:
      - provider onboarding persists its own state, expires_at, last_verified_at and revocation lifecycle
      - source portfolio persists a separate authorization_expires_at and computes AUTHORIZATION_EXPIRED from portfolio/catalog state
      - source portfolio synchronization and health do not consume ProviderOnboardingRecord authorization state
      - incremental and backfill workers gate execution through source_execution_allowed, which consults portfolio state but not onboarding state
      - historical Lot10 exit criteria explicitly compose catalogue -> onboarding -> backfill -> incremental refresh -> health -> disable and require automatic stop at authorization expiry
    invariant: >-
      Provider onboarding is the authoritative credential/authorization truth and source portfolio is the
      authoritative execution decision point. Every network-capable execution path must compose the current
      onboarding authorization state with portfolio status, freshness, quota/cost and adapter availability;
      revoked, expired, failed, rotated-but-unverified or otherwise non-current authorization must deny execution,
      including jobs already queued before the state change. The decision is revalidated immediately before
      provider network without introducing a competing global reconciliation architecture.
    terminal_disposition: null

