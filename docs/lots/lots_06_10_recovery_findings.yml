    disposition: terminal_already_proven
    rationale: >-
      The Lot08 identity module itself remains conservative: exact official identifiers are the safe automatic
      confirmation boundary while ambiguous/conflicting/name-only candidates remain review-required. R02-F07 is
      deliberately a Lot07 integration finding: ATS commercial projection does not currently prove it has consumed
      this identity authority before upserting a canonical organization.

