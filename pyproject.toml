[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cyber-intelligence-platform"
version = "0.2.0"
description = "Human-operated cyber revenue intelligence and opportunity platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hillel Tobiana" }]
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.140.4",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.43",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[project.scripts]
cip-api = "cip.cli:run_api"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires local infrastructure or database",
  "e2e: exercises a complete product workflow",
]

[tool.coverage.run]
branch = true
source = ["cip"]
omit = [
  "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
precision = 2
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"infra/migrations/versions/*.py" = ["I001"]
"tests/unit/source_governance/test_policy.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cip"]
mypy_path = "src"
