[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cyber-intelligence-platform"
version = "0.24.0"
description = "Standalone cyber revenue intelligence and commercial operations platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hillel Tobiana" }]
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.140.4",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pypdf==6.15.0",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.43",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
  "types-PyYAML==6.0.12.20250516",
]

[project.scripts]
cip-api = "cip.cli:run_api"
cip-scheduler = "cip.cli:run_scheduler"
cip-worker = "cip.cli:run_worker"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires local infrastructure or database",
  "e2e: exercises a complete product workflow",
]

[tool.coverage.run]
branch = true
source = ["cip"]
omit = [
  "src/cip/apps/*",
  "src/cip/cli.py",
  "src/cip/shared/persistence/*",
  "src/cip/shared/telemetry/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FAST",
  "FLY",
  "FURB",
  "I",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "PYI",
  "RET",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "S101",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "S105", "S106", "S311", "SLF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
exclude = ["^alembic/versions/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
