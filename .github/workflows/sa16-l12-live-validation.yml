name: SA-16 L12 Live Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sa16-l12-live-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  live-crawl-runtime:
    if: github.event.pull_request.head.ref == 'agent/sa16-l12-crawl-deadline-concurrency-telemetry'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install standard runtime only
        run: python -m pip install .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Configure controlled first-party fixture hostname
        run: echo '127.0.0.1 sa16-l12-fixture.example' | sudo tee -a /etc/hosts

      - name: Controlled crawl deadline, concurrency and telemetry validation
        run: python scripts/sa16_l12_crawl_runtime_live.py
