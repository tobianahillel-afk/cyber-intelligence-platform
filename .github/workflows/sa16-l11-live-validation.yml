name: SA-16 L11 Live Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sa16-l11-live-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  live-rendered-structured-state:
    if: github.event.pull_request.head.ref == 'agent/sa16-l11-rendered-structured-state'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and isolated browser bindings
        run: |
          python -m pip install .
          python -m pip install playwright==1.61.0

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Install bounded Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Configure controlled first-party fixture hostname
        run: echo '127.0.0.1 sa16-l11-fixture.example' | sudo tee -a /etc/hosts

      - name: Controlled rendered JSON and script-state validation
        run: python scripts/sa16_l11_rendered_structured_state_live.py