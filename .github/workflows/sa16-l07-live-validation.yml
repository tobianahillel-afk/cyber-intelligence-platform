name: SA-16 L07 Live Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sa16-l07-live-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  live-public-browser-rendering:
    if: github.event.pull_request.head.ref == 'agent/sa16-l07-bounded-browser-rendering'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and isolated browser bindings
        run: |
          python -m pip install .
          python -m pip install playwright==1.61.0

      - name: Verify browser worker dependency consistency
        run: python -m pip check

      - name: Install bounded Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Controlled real public browser validation
        run: python scripts/sa16_l07_browser_check.py
