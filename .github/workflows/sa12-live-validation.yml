name: SA-12 Live Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sa12-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-public-procurement-funding:
    if: >-
      github.event.pull_request.head.ref == 'agent/sa12-procurement-funding-expansion' ||
      github.event.pull_request.head.ref == 'agent/sa12-eu-funding-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Controlled PLACE, ADEME and CORDIS live validation
        run: python scripts/live_validate_sa12.py
