name: SA-13 Live Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sa13-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-public-ats:
    if: github.event.pull_request.head.ref == 'agent/sa13-ats-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Controlled Ashby and Recruitee live validation
        run: python scripts/live_validate_sa13.py
