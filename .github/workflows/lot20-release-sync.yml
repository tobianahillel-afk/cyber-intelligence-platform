name: Lot 20 release sync

on:
  push:
    branches:
      - agent/entity-resolution-knowledge-graph
    paths:
      - .github/workflows/lot20-release-sync.yml

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Lot 20 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/entity-resolution-knowledge-graph
          fetch-depth: 0

      - name: Synchronize release 0.21.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "src/cip/__init__.py",
              '__version__ = "0.20.0"',
              '__version__ = "0.21.0"',
          )
          replace_exact(
              "pyproject.toml",
              'version = "0.20.0"',
              'version = "0.21.0"',
          )

          replace_exact(
              "README.md",
              "The current validated release is version `0.20.0`, covering lots `00` through `19`.",
              "The current validated release is version `0.21.0`, covering lots `00` through `20`.",
          )
          replace_exact(
              "README.md",
              "- temporal provider, customer, partner, supplier, reseller, integrator, auditor, insurer, MSSP/MDR, cloud-provider, technology-vendor, and subcontractor relationship intelligence with immutable evidence history, explicit evidence classes, reversible chronology, protected APIs, and the Relationships workspace.",
              "- temporal provider, customer, partner, supplier, reseller, integrator, auditor, insurer, MSSP/MDR, cloud-provider, technology-vendor, and subcontractor relationship intelligence with immutable evidence history, explicit evidence classes, reversible chronology, protected APIs, and the Relationships workspace;\n- temporal entity-resolution and corporate-graph intelligence with immutable node/edge history, exact alias/identifier/domain references, review-only probabilistic candidates, historical queries, reversible analyst decisions, versioned blast-radius previews, protected APIs, and the Graph workspace.",
          )
          replace_exact(
              "README.md",
              "Lot `19` provides temporal, directed, evidence-backed organization relationships. It separates claimed, observed, contracted, historical, and inferred evidence; preserves source/target direction, endpoint identity review, validity, expiry, corrections and retractions; and keeps contract/product/service contexts separate from source evidence. Marketing claims are not contract evidence, historical or inferred relationships are not current incumbents, and relationship evidence is not a need, opportunity, or authorization to contact. New relationship providers remain unauthorized, unscheduled, and non-executable candidates.\n\nThe next planned implementation lot is `20`: entity resolution and the temporal corporate knowledge graph.",
              "Lot `19` provides temporal, directed, evidence-backed organization relationships. It separates claimed, observed, contracted, historical, and inferred evidence; preserves source/target direction, endpoint identity review, validity, expiry, corrections and retractions; and keeps contract/product/service contexts separate from source evidence. Marketing claims are not contract evidence, historical or inferred relationships are not current incumbents, and relationship evidence is not a need, opportunity, or authorization to contact. New relationship providers remain unauthorized, unscheduled, and non-executable candidates.\n\nLot `20` provides a PostgreSQL-backed temporal corporate knowledge graph over previously persisted evidence. It preserves source lineage, evidence class, chronology, suppression and correction state; treats shared names, aliases, domains and identifiers as conflicts rather than automatic merges; separates deterministic exact resolution from review-only probabilistic candidates; and makes merge, reject, split, override and restore decisions append-only and reversible through versioned blast-radius previews. Graph membership is not an evidence upgrade, verified exposure, compromise, service need, opportunity, contact target, or outreach authorization.\n\nThe next planned implementation lot is `21`: professional organization maps, contacts, and public community signals.",
          )
          graph_flow = """Entity resolution remains a reversible projection over source-aware evidence:

```text
persisted organization / identity / relationship / asset / incident / change / applicability evidence
  -> immutable graph node and edge snapshots
  -> deterministic exact resolution or review-only candidate
  -> temporal projection and analyst conflict queue
  -> versioned blast-radius preview
  -> append-only human merge / reject / split / override / restore decision

same name, alias, domain, or identifier
  != same legal entity
graph membership
  != evidence upgrade
historical or inferred edge
  != verified current fact
resolution decision
  != opportunity or authorization to contact
```

"""
          replace_exact(
              "README.md",
              "Provider payloads remain inside adapter packages. Adapters never write directly to company, score, alert, or opportunity projections.",
              graph_flow + "Provider payloads remain inside adapter packages. Adapters never write directly to company, score, alert, or opportunity projections.",
          )
          replace_exact(
              "README.md",
              "The `/research`, `/vulnerabilities`, `/incidents`, `/threat-intelligence`, `/passive-exposure`, `/vulnerability-applicability`, `/corporate-changes`, and `/relationships` workspaces and their APIs search persisted data only.",
              "The `/research`, `/vulnerabilities`, `/incidents`, `/threat-intelligence`, `/passive-exposure`, `/vulnerability-applicability`, `/corporate-changes`, `/relationships`, and `/graph` workspaces and their APIs search persisted data only.",
          )
          replace_exact(
              "README.md",
              "4. evidence, observations, public claims, vulnerability snapshots, incident claims, telemetry snapshots, passive observation snapshots, advisory revisions, corporate-change claim revisions, and relationship evidence snapshots;\n5. resolved organizations, incidents, vulnerabilities, indicators, passive assets, technologies, products, providers, material changes, business relationships, roles, and temporal relationships;",
              "4. evidence, observations, public claims, vulnerability snapshots, incident claims, telemetry snapshots, passive observation snapshots, advisory revisions, corporate-change claim revisions, relationship evidence snapshots, and immutable corporate-graph snapshots;\n5. resolved organizations, incidents, vulnerabilities, indicators, passive assets, technologies, products, providers, material changes, business relationships, roles, temporal relationships, and reversible entity-resolution bindings;",
          )
          replace_exact(
              "README.md",
              "- lots `00–19`: implemented and validated foundations, procurement, hiring, identity, onboarding, source runtime, contracts, public footprint, vulnerability knowledge, public incident intelligence, defensive telemetry, passive technographic evidence, vendor advisories, vulnerability applicability, corporate/regulatory change intelligence, and temporal relationship intelligence;\n- lot `20`: entity resolution and temporal corporate knowledge graph;\n- lots `20–23`: entity resolution, professional context, conditional sources, and governed research orchestration;",
              "- lots `00–20`: implemented and validated foundations, procurement, hiring, identity, onboarding, source runtime, contracts, public footprint, vulnerability knowledge, public incident intelligence, defensive telemetry, passive technographic evidence, vendor advisories, vulnerability applicability, corporate/regulatory change intelligence, temporal relationship intelligence, entity resolution, and the temporal corporate knowledge graph;\n- lot `21`: professional organization maps, contacts, and public community signals;\n- lots `21–23`: professional context, conditional sources, and governed research orchestration;",
          )
          replace_exact(
              "README.md",
              "- relationship intelligence cannot import network clients, collection adapters, or opportunity modules.",
              "- relationship intelligence cannot import network clients, collection adapters, or opportunity modules;\n- corporate graph cannot import network clients, source adapters, browser automation, `neo4j`, or `networkx`, and its domain cannot depend on FastAPI, SQLAlchemy, infrastructure implementations, or opportunity modules.",
          )
          replace_exact(
              "README.md",
              "- treat a historical or inferred organization relationship as a verified current relationship.",
              "- treat a historical or inferred organization relationship as a verified current relationship;\n- treat shared names, aliases, domains, or identifiers as automatic entity merges;\n- treat graph membership or a resolution candidate as an upgrade in evidence strength.",
          )
          replace_exact(
              "README.md",
              "- [`docs/lots/LOT_19_VALIDATION_REPORT.md`](docs/lots/LOT_19_VALIDATION_REPORT.md)\n- [`SECURITY.md`](SECURITY.md)",
              "- [`docs/lots/LOT_19_VALIDATION_REPORT.md`](docs/lots/LOT_19_VALIDATION_REPORT.md)\n- [`docs/lots/LOT_20_ENTITY_RESOLUTION_CORPORATE_GRAPH.md`](docs/lots/LOT_20_ENTITY_RESOLUTION_CORPORATE_GRAPH.md)\n- [`docs/lots/LOT_20_VALIDATION_REPORT.md`](docs/lots/LOT_20_VALIDATION_REPORT.md)\n- [`SECURITY.md`](SECURITY.md)",
          )

          replace_exact(
              "docs/PROJECT_DELIVERY_PLAN.md",
              "| 20 | Entity resolution and temporal corporate knowledge graph | `PLANNED_LOCKED` |",
              "| 20 | Entity resolution and temporal corporate knowledge graph | `IMPLEMENTED_VALIDATED` |",
          )
          replace_exact(
              "docs/PROJECT_DELIVERY_PLAN.md",
              "## Lot 20 — Entity resolution and temporal corporate knowledge graph\n\n**Status:** `PLANNED_LOCKED`\n\n**Primary business outcome:** Reconcile organizations, establishments, groups, brands, domains, products, incidents, assets, providers, and relationships into a temporal graph with reversible merge/split decisions.",
              "## Lot 20 — Entity resolution and temporal corporate knowledge graph\n\n**Status:** `IMPLEMENTED_VALIDATED`\n\n**Outcome:** Reconcile organizations, establishments, groups, brands, domains, products, incidents, assets, providers, and relationships into a temporal graph with reversible merge/split decisions.",
          )
          old_boundary = """Version `0.20.0` implements and validates lots `00–19`. Lot 19 installs directed temporal business relationships, immutable evidence snapshots, claimed/observed/contracted/historical/inferred evidence classes, explicit endpoint identity review, validity and renewal chronology, contract-backed current state, reversible persistence, protected APIs, and the Relationships workspace.

Existing persisted procurement contracts can project into contracted relationship evidence without authorizing new network collection. Generic public/provider relationship schemas cannot emit contracted evidence. New relationship source candidates remain authorization-missing, unscheduled, non-executable, and forbidden from private portals, personal networks, automatic opportunity creation, contact enrichment, or outreach.

Lot 20 is the next locked implementation lot. It must start from the merged Lot 19 `main` commit and preserve reversible identity decisions, temporal validity, source lineage, evidence class, relationship direction, confidence, correction, suppression, and review state. Claimed or inferred edges must not silently become verified facts merely because they enter the graph."""
          new_boundary = """Version `0.21.0` implements and validates lots `00–20`. Lot 20 installs a PostgreSQL-backed temporal corporate knowledge graph with immutable node and edge snapshots, exact alias/identifier/domain references, explainable review-only probabilistic candidates, conflict queues, historical `as_of` reads, reversible merge/reject/split/override/restore decisions, and resolution-state-aware blast-radius previews.

The graph is a metadata projection over already persisted evidence and PostgreSQL remains the source of truth. Shared names, aliases, domains, identifiers, weak/historical/inferred relationship evidence, incident reports, material changes, passive observations, and vulnerability applicability never silently become verified entity identity, exposure, compromise, service need, opportunity, contact target, or outreach authorization merely because they enter the graph.

Lot 21 is the next locked implementation lot. It must start from the merged Lot 20 `main` commit and add professional roles, teams, public business contact channels, employment chronology, lawful-basis/minimization/suppression/deletion controls, and consented public community context without private messages, friend graphs, personal addresses, private-life profiling, or unauthorized LinkedIn/Discord automation."""
          replace_exact("docs/PROJECT_DELIVERY_PLAN.md", old_boundary, new_boundary)

          replace_exact(
              "docs/lots/LOT_20_ENTITY_RESOLUTION_CORPORATE_GRAPH.md",
              "Implementation in progress on `agent/entity-resolution-knowledge-graph`.\n\nTarget release: `0.21.0`.\n\nThe lot is not complete until the exact final pull-request head passes every standard backend and frontend gate and is merged into `main`.",
              "Implementation is complete on `agent/entity-resolution-knowledge-graph`. Functional candidate `993c2853b2475a336b21254e7067b5be34d0857e` passed the complete standard CI as run #1087.\n\nTarget release: `0.21.0`.\n\nThe release remains merge-authorized only when the exact post-version/documentation pull-request head also passes every standard backend and frontend gate and is merged into `main`.",
          )

          validation = """# Lot 20 — Validation report

## Decision

- Technical implementation: **FUNCTIONALLY VALIDATED; FINAL EXACT-SHA RELEASE CI REQUIRED**.
- Entity-resolution safety boundary: **VALIDATED ON FUNCTIONAL CANDIDATE**.
- Temporal graph and immutable history: **VALIDATED ON FUNCTIONAL CANDIDATE**.
- New external source activation: **NOT APPLICABLE / NOT INTRODUCED**.
- Production graph database: **NOT INTRODUCED**; PostgreSQL remains the source of truth.
- Target release: `0.21.0`.
- Authoritative pull request: #56.

The lot is not merge-authorized until the exact final pull-request head passes the full standard repository CI after every version, README, roadmap and validation-document update. Final exact-SHA evidence is recorded in the pull-request checks and PR body so documenting it never invalidates the SHA it describes.

## Delivered scope

Lot 20 delivers:

- a dedicated `corporate_graph` bounded context;
- temporal nodes for organizations, establishments, groups, brands, aliases, exact identifiers, domains, assets, technologies, products, incidents, vulnerabilities, providers and material changes;
- source-aware directed edges for identity, alias, exact identifiers, structure, mergers/spin-offs, domains/assets, technology/product use, incidents, applicability, material changes and business relationships;
- immutable node and edge source snapshots with deterministic digests;
- current PostgreSQL projections plus historical `as_of` reconstruction;
- explicit correction/retraction/dispute/expiry/suppression semantics;
- conservative entity-resolution candidates with no probabilistic auto-merge;
- homonym, reused-domain and reused-identifier conflict handling;
- append-only merge/reject/split/override/restore decisions;
- analyst bindings layered over source history rather than mutating it;
- resolution-state-aware blast-radius fingerprints;
- downstream impact counts for identities, relationships, applicability, commercial signals and opportunities;
- deterministic local graph refresh from previously persisted evidence only;
- protected `/v1/graph` APIs;
- `/graph` analyst workspace, historical node detail and resolution-review workspace;
- server-side analyst decision actions that keep the control-plane token out of the browser;
- reversible migration `20260808_0020`;
- architecture gates forbidding network clients, source adapters, browser automation, `neo4j`, `networkx`, and framework/infrastructure/opportunity dependencies from the graph domain.

## Mandatory evidence boundary

```text
same or similar name
!= same organization

shared or reused domain
!= same organization

alias or reused identifier
!= verified identity

probabilistic candidate
!= merged entity

graph membership
!= stronger evidence

historical, claimed or inferred edge
!= verified current relationship

vulnerability applicability
!= verified exposure

incident claim
!= confirmed compromise

resolution decision
!= deletion or mutation of source history
```

## False-merge protections

The implementation includes deterministic regression cases for exact-name homonyms, reused domains, reused exact registration identifiers, similar-but-not-exact names, conflicting exact source bindings and rebrands with retained history. Ambiguous cases create review candidates or remain unresolved; they do not create an automatic binding.

## Reversible resolution and blast radius

Every merge-style decision is append-only. The current binding is stored separately from source snapshots. The blast-radius fingerprint includes the target organization, affected graph/downstream counts and current binding revision. A stale or target-mismatched fingerprint is rejected. Split restores the source-derived projection while retaining earlier decisions; restore can subsequently re-establish a reviewed binding without rewriting history.

## Source and runtime boundary

Lot 20 adds no external collector, source authorization, network client, browser runtime, graph database, autonomous opportunity creation, contact enrichment or outreach path. Explicit graph refresh only projects records already stored in PostgreSQL; normal analyst page views are persisted-data reads and never trigger source collection or graph refresh.

## Functional validation evidence

Functional candidate SHA: `993c2853b2475a336b21254e7067b5be34d0857e`.

GitHub Actions CI: run #1087, run ID `31284785175`.

- dependency consistency: passed;
- Python dependency audit: no known vulnerabilities;
- Ruff: passed;
- Mypy: 446 source files, zero issues;
- architecture/release contracts: 26 passed;
- PostgreSQL migration: `upgrade head -> downgrade base -> upgrade head` passed through `20260808_0020`;
- backend suite: 884 passed, 1 warning;
- aggregate branch-aware coverage: 90.22%;
- frontend dependency audit: passed;
- TypeScript typecheck: passed;
- Next.js production build: passed;
- review threads at functional-candidate audit: zero unresolved.

This functional evidence does not authorize merge after the release-document/version synchronization because those changes create a new SHA.

## Final release gate

The exact final release head must repeat the full standard CI. The PR body must record the final SHA, final CI run, backend/frontend success and final review-thread state before squash merge. Any code or documentation commit after that CI invalidates the evidence and requires another complete run.

## Lot 21 handoff boundary

Lot 21 may start only from the exact merged Lot 20 squash commit on `main`. Professional organization maps, contacts and public-community context must consume graph identities conservatively and preserve privacy, source authorization, temporal validity, analyst review and the distinction between a professional-role clue and lawful contact authorization.
"""
          Path("docs/lots/LOT_20_VALIDATION_REPORT.md").write_text(validation, encoding="utf-8")
          PY

          rm .github/workflows/lot20-release-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pyproject.toml src/cip/__init__.py docs/PROJECT_DELIVERY_PLAN.md docs/lots/LOT_20_ENTITY_RESOLUTION_CORPORATE_GRAPH.md docs/lots/LOT_20_VALIDATION_REPORT.md .github/workflows/lot20-release-sync.yml
          git diff --cached --check
          git commit -m "Lot 20: prepare release 0.21.0"
          git push origin HEAD:agent/entity-resolution-knowledge-graph
