name: SA-16 L06 Live Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sa16-l06-live-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  live-ooxml-public-document:
    if: github.event.pull_request.head.ref == 'agent/sa16-l06-ooxml-documents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Controlled real public DOCX validation
        run: python scripts/live_validate_sa16_l06.py
