name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cip_test
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cip -d cip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIP_ENVIRONMENT: test
      CIP_DATABASE_URL: postgresql+psycopg://cip:cip@localhost:5432/cip_test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Architecture and release contracts
        run: pytest tests/architecture --junitxml=architecture-junit.xml

      - name: Validate reversible migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests and coverage
        run: >-
          pytest
          --junitxml=junit.xml
          --cov=cip
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Publish backend test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            architecture-junit.xml
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # pinned 2026-07-29
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  lot16-release-doc-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/passive-exposure-final'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out Lot 16 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Synchronize release documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              if old not in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: replacement is ambiguous")
              return text.replace(old, new, 1)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "The current validated release is version `0.16.0`, covering lots `00` through `15`.",
              "The current validated release is version `0.17.0`, covering lots `00` through `16`.",
              label="README release baseline",
          )
          readme = replace_once(
              readme,
              "- canonical defensive threat indicators with deterministic normalization, immutable source history, conflicting classifications, sensor scope, campaign/malware/CVE relations, protected APIs, and the Threat Intel workspace.",
              "- canonical defensive threat indicators with deterministic normalization, immutable source history, conflicting classifications, sensor scope, campaign/malware/CVE relations, protected APIs, and the Threat Intel workspace;\n- canonical passive assets and technographic observations with immutable revisions, explicit attribution risks, protected APIs, and the Passive Exposure workspace.",
              label="README implemented capability",
          )
          readme = replace_once(
              readme,
              "Lot `16` is the active `0.17.0` release candidate and remains `IN_PROGRESS` until one exact final commit passes every required CI gate. The candidate provides passive exposure and technographic observations without probing assets or verifying exposure. It normalizes public technical assets, preserves immutable provider revisions and supersession history, separates technology mentions from passive observations and observed versions, and represents organization attribution as exact, candidate, review-required, rejected, or unresolved with explicit risks. It performs no authentication, service connection, applicability assessment, opportunity creation, or outreach. All newly modeled passive providers remain unauthorized, unscheduled, and non-executable candidates.\n\nLot `17`, official advisories, customer technologies, and vulnerability applicability, remains planned and must not start before Lot `16` is validated and merged to `main`.",
              "Lot `16` provides validated passive exposure and technographic observations without probing assets or verifying exposure. It normalizes public technical assets, preserves immutable provider revisions and supersession history, separates technology mentions from passive observations and observed versions, and represents organization attribution as exact, candidate, review-required, rejected, or unresolved with explicit risks. It performs no authentication, service connection, applicability assessment, opportunity creation, or outreach. All newly modeled passive providers remain unauthorized, unscheduled, and non-executable candidates.\n\nThe next planned implementation lot is `17`: official advisories, customer technologies, product versions and vulnerability applicability.",
              label="README Lot 16 boundary",
          )
          readme = replace_once(
              readme,
              "- lots `00–15`: implemented and validated foundations, procurement, hiring, identity, onboarding, source runtime, contracts, public footprint, vulnerability knowledge, public incident intelligence, and defensive telemetry;\n- lot `16`: active `0.17.0` release candidate for passive exposure and technographic observations, pending final CI and merge;\n- lots `17–19`: advisories and applicability, corporate changes, and provider relationships;",
              "- lots `00–16`: implemented and validated foundations, procurement, hiring, identity, onboarding, source runtime, contracts, public footprint, vulnerability knowledge, public incident intelligence, defensive telemetry, and passive technographic evidence;\n- lots `17–19`: advisories and applicability, corporate changes, and provider relationships;",
              label="README roadmap summary",
          )
          readme_path.write_text(readme, encoding="utf-8")

          roadmap_path = Path("docs/PROJECT_DELIVERY_PLAN.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap = replace_once(
              roadmap,
              "| 16 | Passive exposure and technographic observations | `IN_PROGRESS` |",
              "| 16 | Passive exposure and technographic observations | `IMPLEMENTED_VALIDATED` |",
              label="roadmap overview status",
          )
          roadmap = replace_once(
              roadmap,
              "## Lot 16 — Passive exposure and technographic observations\n\n**Status:** `IN_PROGRESS`",
              "## Lot 16 — Passive exposure and technographic observations\n\n**Status:** `IMPLEMENTED_VALIDATED`",
              label="roadmap Lot 16 status",
          )
          roadmap = replace_once(
              roadmap,
              "**Primary business outcome:** Prepare release candidate `0.17.0` with canonical passive assets, immutable provider observations, explicit chronology and expiration, source-aware organization attribution with reviewable risks, separated technology evidence levels, reversible persistence, protected APIs, and the Passive Exposure workspace without active validation or exposure claims.",
              "**Primary business outcome:** Release `0.17.0` with canonical passive assets, immutable provider observations, explicit chronology and expiration, source-aware organization attribution with reviewable risks, separated technology evidence levels, reversible persistence, protected APIs, and the Passive Exposure workspace without active validation or exposure claims.",
              label="roadmap Lot 16 outcome",
          )
          old_boundary = (
              "## Current release boundary\n\n"
              "Version `0.17.0` is the Lot 16 release candidate. Lots `00–15` remain implemented and validated; Lot `16` remains `IN_PROGRESS` until one exact final commit passes every required backend, frontend, architecture, migration, security, documentation, and rollback gate.\n\n"
              "The Lot 16 candidate installs canonical passive assets, immutable provider observation snapshots, explicit current/historical/expired/corrected/retracted/deleted states, organization-link confidence and attribution risks, technology evidence levels, reversible persistence, protected APIs, and the Passive Exposure workspace. Its provider schemas are installed behind unauthorized, unscheduled, non-executable candidates without registered adapters. The candidate does not authorize active probes, authentication, service connection, exploitation, credential use, applicability assessment, exposure verification, autonomous opportunity creation, or outreach. Passive metadata cannot independently label a named organization vulnerable, exposed, or compromised.\n\n"
              "Lot 17 must start from the merged Lot 16 `main` commit and must preserve the distinction between observed technology evidence, vendor version ranges, applicability, and verified exposure.\n"
          )
          new_boundary = (
              "## Current release boundary\n\n"
              "Version `0.17.0` implements and validates lots `00–16`. Lot 16 installs canonical passive assets, immutable provider observation snapshots, explicit current/historical/expired/corrected/retracted/deleted states, organization-link confidence and attribution risks, technology evidence levels, reversible persistence, protected APIs, and the Passive Exposure workspace.\n\n"
              "Its provider schemas remain behind unauthorized, unscheduled, non-executable candidates without registered adapters. The release does not authorize active probes, authentication, service connection, exploitation, credential use, applicability assessment, exposure verification, autonomous opportunity creation, or outreach. Passive metadata cannot independently label a named organization vulnerable, exposed, or compromised.\n\n"
              "Lot 17 is the next locked implementation lot. It must start from the merged Lot 16 `main` commit and preserve the distinction between observed technology evidence, vendor version ranges, applicability, and verified exposure.\n"
          )
          roadmap = replace_once(
              roadmap,
              old_boundary,
              new_boundary,
              label="roadmap current release boundary",
          )
          roadmap_path.write_text(roadmap, encoding="utf-8")
          PY

      - name: Commit synchronized documentation
        run: |
          if git diff --quiet -- README.md docs/PROJECT_DELIVERY_PLAN.md; then
            echo "Release documentation is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PROJECT_DELIVERY_PLAN.md
          git diff --cached --check
          git commit -m "Lot 16: synchronize validated release documentation"
          git push origin HEAD:${{ github.head_ref }}
