name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cip_test
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cip -d cip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIP_ENVIRONMENT: test
      CIP_DATABASE_URL: postgresql+psycopg://cip:cip@localhost:5432/cip_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify standard runtime imports without browser bindings
        run: >-
          python -c
          "import cip.modules.collection_orchestration.application.adapter_composition"

      - name: Install isolated browser bindings for static analysis and unit tests
        run: python -m pip install playwright==1.61.0

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Architecture and release contracts
        run: pytest tests/architecture --junitxml=architecture-junit.xml

      - name: Validate reversible migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests and coverage
        run: >-
          pytest
          --junitxml=junit.xml
          --cov=cip
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Publish backend test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            architecture-junit.xml
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # pinned 2026-07-29
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
