name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cip_test
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cip -d cip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIP_ENVIRONMENT: test
      CIP_DATABASE_URL: postgresql+psycopg://cip:cip@localhost:5432/cip_test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: pip-audit --strict

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Validate reversible migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests and coverage
        run: >-
          pytest
          --cov=cip
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
