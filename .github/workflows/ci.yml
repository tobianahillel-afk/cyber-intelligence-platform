name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/vendor-advisory-applicability'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}

      - name: Synchronize Lot 17 roadmap status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/PROJECT_DELIVERY_PLAN.md")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "| 17 | Vendor advisories, product versions, and applicability | `PLANNED_LOCKED` |",
                  "| 17 | Vendor advisories, product versions, and applicability | `IMPLEMENTED_VALIDATED` |",
              ),
              (
                  "## Lot 17 — Vendor advisories, product versions, and applicability\n\n**Status:** `PLANNED_LOCKED`\n\n**Primary business outcome:** Reconcile vendor advisories, product naming, version ranges, support status, fixes, mitigations, and applicability so vulnerability knowledge can be compared with organization-specific technology evidence without unsafe automatic conclusions.",
                  "## Lot 17 — Vendor advisories, product versions, and applicability\n\n**Status:** `IMPLEMENTED_VALIDATED`\n\n**Outcome:** Reconcile vendor advisories, product naming, version ranges, support status, fixes, mitigations, and applicability so vulnerability knowledge can be compared with organization-specific technology evidence without unsafe automatic conclusions.",
              ),
              (
                  "Version `0.17.0` implements and validates lots `00–16`. Lot 16 installs canonical passive assets, immutable provider observation snapshots, explicit current/historical/expired/corrected/retracted/deleted states, organization-link confidence and attribution risks, technology evidence levels, reversible persistence, protected APIs, and the Passive Exposure workspace.",
                  "Version `0.18.0` implements and validates lots `00–17`. Lot 17 installs canonical vendor and product identities, immutable advisory revisions and affected ranges, support lifecycle, fixes and mitigations, explainable organization-specific applicability assessments, immutable assessment history, reversible persistence, protected APIs, and the Vulnerability Applicability workspace.",
              ),
              (
                  "Its provider schemas remain behind unauthorized, unscheduled, non-executable candidates without registered adapters. The release does not authorize active probes, authentication, service connection, exploitation, credential use, applicability assessment, exposure verification, autonomous opportunity creation, or outreach. Passive metadata cannot independently label a named organization vulnerable, exposed, or compromised.",
                  "Its advisory provider schemas remain behind unauthorized, unscheduled, non-executable candidates without registered adapters. The release does not authorize active probes, authentication, service connection, exploitation, credential use, exposure verification, autonomous opportunity creation, or outreach. Applicability is computed only from already stored organization-specific technology evidence and official advisory affected-range evidence; it is not verified exposure or proof of compromise.",
              ),
              (
                  "Lot 17 is the next locked implementation lot. It must start from the merged Lot 16 `main` commit and preserve the distinction between observed technology evidence, vendor version ranges, applicability, and verified exposure.",
                  "Lot 18 is the next locked implementation lot. It must start from the merged Lot 17 `main` commit and preserve source-aware distinctions among original disclosures, regulator statements, company statements, reporting, commentary, speculation, corrections, and retractions.",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected roadmap text not found: {old[:90]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_DELIVERY_PLAN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lot 17: synchronize authoritative roadmap"
          git push origin HEAD:${{ github.head_ref }}

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cip_test
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cip -d cip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIP_ENVIRONMENT: test
      CIP_DATABASE_URL: postgresql+psycopg://cip:cip@localhost:5432/cip_test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Architecture and release contracts
        run: pytest tests/architecture --junitxml=architecture-junit.xml

      - name: Validate reversible migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests and coverage
        run: >-
          pytest
          --junitxml=junit.xml
          --cov=cip
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Publish backend test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            architecture-junit.xml
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # pinned 2026-07-29
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
