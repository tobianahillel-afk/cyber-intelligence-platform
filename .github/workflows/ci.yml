name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cip_test
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cip -d cip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIP_ENVIRONMENT: test
      CIP_DATABASE_URL: postgresql+psycopg://cip:cip@localhost:5432/cip_test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Architecture and release contracts
        run: pytest tests/architecture --junitxml=architecture-junit.xml

      - name: Validate reversible migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests and coverage
        run: >-
          pytest
          --junitxml=junit.xml
          --cov=cip
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Publish backend test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            architecture-junit.xml
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # pinned 2026-07-29
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  lot20-release-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/entity-resolution-knowledge-graph'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Lot 20 branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/entity-resolution-knowledge-graph
          fetch-depth: 0

      - name: Produce clean 0.21.0 release head
        shell: bash
        run: |
          set -euo pipefail
          python .github/lot20_release_sync.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/lot20-release-sync.yml .github/lot20_release_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Lot 20: prepare release 0.21.0"
          git push origin HEAD:agent/entity-resolution-knowledge-graph
