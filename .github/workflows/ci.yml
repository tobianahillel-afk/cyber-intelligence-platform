          )
          marker = "## Current release boundary\n"
          if text.count(marker) != 1:
              raise SystemExit("roadmap current release boundary marker missing or duplicated")
          prefix = text.split(marker, 1)[0]
          release_tail = '''## Current release boundary

Version `0.22.0` implements and validates lots `00–21`. Lot 21 adds source-aware professional organization context with temporal role/team and direct reporting-line evidence, public business contact channels, authorized public-community metadata, explicit lawful-basis/purpose/retention state, correction and retraction history, protected persisted-data-only APIs, and the Professional Context analyst workspace.

Professional context remains a bounded evidence layer. Same display names never create automatic person merges; role claims do not become verified employment; reporting lines are not inferred transitively; public business contacts are not personal contact details; public professional profiles do not authorize platform automation; service relevance does not create a commercial signal, need hypothesis, or opportunity; and contact relevance does not authorize outreach. Valid erasure tombstones raw identifying values while retaining pseudonymous technical lineage and HMAC suppression audit, and ordinary source replay cannot resurrect a deleted subject.

All newly modeled Lot 21 source families remain non-executable candidates without approved hosts, paths, schedules, or runtime adapters. LinkedIn, Discord, BrixHub, premium providers, and other account- or licence-dependent paths remain disabled unless Lot 22 records a positive provider-specific approval dossier covering exact method, scopes, fields, purpose, retention, licence, security, revocation, quota, and cost.

Lot 22 is the next locked implementation lot and must start from the merged Lot 21 `main` commit.
'''
          plan.write_text(prefix + release_tail, encoding="utf-8")

          lot_doc = Path("docs/lots/LOT_21_PROFESSIONAL_CONTEXT.md")
          lot_text = lot_doc.read_text(encoding="utf-8")
          old_status = (
              "Implementation in progress on `agent/professional-organization-maps` from exact "
              "Lot 20 squash `108144a9ad52805c6127dfffb3b31050313e8070`.\n\n"
              "Target release: `0.22.0`.\n\n"
              "The lot is not complete until the exact final pull-request head passes every "
              "standard backend and frontend gate and is squash-merged into `main`."
          )
          new_status = (
              "Release candidate `0.22.0` is implemented on `agent/professional-organization-maps` "
              "from exact Lot 20 squash `108144a9ad52805c6127dfffb3b31050313e8070`.\n\n"
              "The integrated functional candidate `243a9d62acd77314cf7eca7f7c80415ecfa31696` "
              "passed every standard backend and frontend gate in CI run `31308364769`. The lot "
              "still requires the same complete CI on the exact final release/documentation SHA "
              "before squash merge."
          )
          if lot_text.count(old_status) != 1:
              raise SystemExit("Lot 21 status block not found exactly once")
          lot_doc.write_text(lot_text.replace(old_status, new_status), encoding="utf-8")

          validation = Path("docs/lots/LOT_21_VALIDATION_REPORT.md")
          validation.write_text('''# Lot 21 — Validation report

## Status

`FUNCTIONAL_CANDIDATE_VALIDATED — FINAL RELEASE CI REQUIRED`

The integrated functional candidate passed every standard backend and frontend gate. This release synchronization changes the commit SHA, so the functional result is supporting evidence only; the exact final release head must pass the same complete CI before merge.

## Scope validated

Lot 21 adds a bounded professional-context capability for analysts:

- source-qualified professional-person references that are never merged by display name alone;
- temporal role/team and direct reporting-line claims without transitive hierarchy inference;
- organization-level and public professional business-contact context;
- authorized public-community metadata only;
- explicit lawful-basis, purpose, retention, review, suppression, correction and deletion state;
- deterministic snapshot replay and current projections;
- HMAC-backed erasure audit with redaction of raw identifying values and replay-resurrection protection;
- service-family relevance that remains separate from signals, opportunities and outreach;
- protected persisted-data-only read APIs;
- analyst pages for professional references, evidence history and organization maps;
- three governed source-candidate families that remain non-executable.

## Non-negotiable boundaries

```text
same display name != same person
professional role claim != verified employment
public business contact != personal contact detail
public professional profile != platform automation authorization
public/consented community context != private-life profile
service relevance != need hypothesis != commercial signal != opportunity
contact relevance != authorization to contact
```

Lot 21 introduces no active scanning, browser automation, authenticated social-platform scraping, private-message access, friend-graph collection, credential handling, automatic opportunity creation or outreach. LinkedIn, Discord, BrixHub and other account/licence-dependent integrations remain Lot 22 and require their own positive approval dossiers before execution.

## Persistence and privacy validation

Migration: `20260809_0021_professional_context.py`.

The persistence contract contains 12 Lot 21 tables spanning current projections, immutable source lineage, service relevance and deletion audit. The functional CI validated PostgreSQL `upgrade head -> downgrade base -> upgrade head` through revision `0021`.

A valid professional-person erasure may tombstone raw identifying values in current projections and retained source-history rows while preserving pseudonymous technical lineage and the HMAC suppression audit. Deleted current records reject ordinary provider replay so erased values cannot be accidentally resurrected.

## Functional candidate evidence

Exact integrated functional SHA: `243a9d62acd77314cf7eca7f7c80415ecfa31696`.

GitHub Actions run: `31308364769` (CI #1182).

- `python -m pip check`: green;
- `pip-audit --skip-editable`: green, no known vulnerabilities;
- Ruff: green;
- strict Mypy: `484` source files, no issues;
- architecture/release contracts: `29 passed`;
- PostgreSQL reversible migration validation through `0021`: green;
- complete pytest suite: `917 passed`;
- aggregate branch-aware coverage: `90.37%`;
- `npm audit --audit-level=high`: green;
- TypeScript typecheck: green;
- Next.js production build: green.

Backend diagnostic artifact ID: `9036672075`.

## Final release gate

The release commit must now prove, on one exact SHA after all version and documentation changes:

1. package and API version `0.22.0` are consistent;
2. README and the delivery roadmap identify lots `00–21` as implemented/validated and Lot 22 as next;
3. every standard backend and frontend CI gate passes again;
4. aggregate branch-aware coverage remains at or above 90%;
5. zero unresolved review threads remain;
6. PR #58 is marked ready only after the final exact-SHA CI is green;
7. squash merge uses the exact validated head SHA.

No later commit may be added after the final validation without rerunning the complete release gate.
''', encoding="utf-8")
          PY

          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

          git diff --check
          echo "Release diff:"
          git diff --stat
          echo "Remaining current-version references outside historical lot docs:"
          git grep -n '0.21.0' -- src pyproject.toml tests README.md docs/PROJECT_DELIVERY_PLAN.md docs/lots/LOT_21_PROFESSIONAL_CONTEXT.md docs/lots/LOT_21_VALIDATION_REPORT.md || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cip/__init__.py pyproject.toml tests README.md docs/PROJECT_DELIVERY_PLAN.md docs/lots/LOT_21_PROFESSIONAL_CONTEXT.md docs/lots/LOT_21_VALIDATION_REPORT.md .github/workflows/ci.yml
          git commit -m "Lot 21: prepare release 0.22.0"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
