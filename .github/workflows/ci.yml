name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cip_test
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cip -d cip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIP_ENVIRONMENT: test
      CIP_DATABASE_URL: postgresql+psycopg://cip:cip@localhost:5432/cip_test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Architecture and release contracts
        run: pytest tests/architecture --junitxml=architecture-junit.xml

      - name: Validate reversible migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests and coverage
        run: >-
          pytest
          --junitxml=junit.xml
          --cov=cip
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Publish backend test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            architecture-junit.xml
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # pinned 2026-07-29
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  lot21-release-sync:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/professional-organization-maps'
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Synchronize Lot 21 release
        env:
          FUNCTIONAL_SHA: 243a9d62acd77314cf7eca7f7c80415ecfa31696
          FUNCTIONAL_RUN_ID: "31308364769"
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}; found {count}")
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/cip/__init__.py",
              '__version__ = "0.21.0"',
              '__version__ = "0.22.0"',
          )
          replace_once(
              "pyproject.toml",
              'version = "0.21.0"',
              'version = "0.22.0"',
          )

          changed_tests = []
          for path in sorted(Path("tests").rglob("*.py")):
              text = path.read_text(encoding="utf-8")
              if "0.21.0" not in text:
                  continue
              path.write_text(text.replace("0.21.0", "0.22.0"), encoding="utf-8")
              changed_tests.append(str(path))
          print("version assertion files:", changed_tests)

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          def readme_replace(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"README replacement expected once, found {count}: {old!r}")
              text = text.replace(old, new)

          readme_replace(
              "The current validated release is version `0.21.0`, covering lots `00` through `20`.",
              "The current validated release is version `0.22.0`, covering lots `00` through `21`.",
          )
          graph_bullet = (
              "- temporal entity-resolution and corporate-graph intelligence with immutable "
              "node/edge history, exact alias/identifier/domain references, review-only "
              "probabilistic candidates, historical queries, reversible analyst decisions, "
              "versioned blast-radius previews, protected APIs, and the Graph workspace."
          )
          professional_bullet = (
              "- governed professional-context intelligence with source-qualified people "
              "references, temporal roles and direct reporting lines, public business contact "
              "channels, consented community metadata, lawful-basis and retention controls, "
              "HMAC-backed erasure, protected APIs, and the Professional Context workspace."
          )
          readme_replace(graph_bullet, graph_bullet + "\n" + professional_bullet)
          lot20_paragraph = (
              "Lot `20` provides a PostgreSQL-backed temporal corporate knowledge graph over "
              "previously persisted evidence. It preserves source lineage, evidence class, "
              "chronology, suppression and correction state; treats shared names, aliases, "
              "domains and identifiers as conflicts rather than automatic merges; separates "
              "deterministic exact resolution from review-only probabilistic candidates; and "
              "makes merge, reject, split, override and restore decisions append-only and "
              "reversible through versioned blast-radius previews. Graph membership is not an "
              "evidence upgrade, verified exposure, compromise, service need, opportunity, "
              "contact target, or outreach authorization."
          )
          lot21_paragraph = (
              "Lot `21` provides source-aware professional organization context without building "
              "private-life profiles. It preserves source-qualified person references, temporal "
              "role/team and direct reporting-line claims, public business contact channels, "
              "authorized public-community metadata, lawful-basis and retention state, correction "
              "history, and HMAC-backed erasure. Same names are not automatic person merges, a "
              "professional role claim is not verified employment, a public profile is not "
              "platform-automation authorization, service relevance is not a need or opportunity, "
              "and contact relevance is not outreach authorization."
          )
          readme_replace(lot20_paragraph, lot20_paragraph + "\n\n" + lot21_paragraph)
          readme_replace(
              "The next planned implementation lot is `21`: professional organization maps, contacts, and public community signals.",
              "The next planned implementation lot is `22`: conditional, premium, LinkedIn, Discord, and BrixHub integrations.",
          )
          relationship_sources = (
              "Selected relationship schemas and deterministic mappings are implemented for:\n\n"
              "- official relationship disclosures;\n"
              "- public partner directories;\n"
              "- bounded public case-study metadata;\n"
              "- public certificate relationship metadata."
          )
          professional_sources = (
              "Selected professional-context candidate contracts are implemented for:\n\n"
              "- organization-published team and business-contact metadata;\n"
              "- licensed or explicitly authorized professional-directory metadata;\n"
              "- approved community exports or APIs with an explicit authorization reference."
          )
          readme_replace(
              relationship_sources,
              relationship_sources + "\n\n" + professional_sources,
          )
          readme_replace(
              "Every newly modeled passive, advisory, corporate-change, or relationship candidate",
              "Every newly modeled passive, advisory, corporate-change, relationship, or professional-context candidate",
          )
          readme_replace(
              "The `/research`, `/vulnerabilities`, `/incidents`, `/threat-intelligence`, `/passive-exposure`, `/vulnerability-applicability`, `/corporate-changes`, `/relationships`, and `/graph` workspaces",
              "The `/research`, `/vulnerabilities`, `/incidents`, `/threat-intelligence`, `/passive-exposure`, `/vulnerability-applicability`, `/corporate-changes`, `/relationships`, `/graph`, and `/professional-context` workspaces",
          )
          readme_replace(
              "relationship evidence snapshots, and immutable corporate-graph snapshots;",
              "relationship evidence snapshots, immutable corporate-graph snapshots, and professional-context evidence snapshots;",
          )
          readme_replace(
              "- lots `00–20`: implemented and validated foundations, procurement, hiring, identity, onboarding, source runtime, contracts, public footprint, vulnerability knowledge, public incident intelligence, defensive telemetry, passive technographic evidence, vendor advisories, vulnerability applicability, corporate/regulatory change intelligence, temporal relationship intelligence, entity resolution, and the temporal corporate knowledge graph;\n- lot `21`: professional organization maps, contacts, and public community signals;\n- lots `21–23`: professional context, conditional sources, and governed research orchestration;",
              "- lots `00–21`: implemented and validated foundations, procurement, hiring, identity, onboarding, source runtime, contracts, public footprint, vulnerability knowledge, public incident intelligence, defensive telemetry, passive technographic evidence, vendor advisories, vulnerability applicability, corporate/regulatory change intelligence, temporal relationship intelligence, entity resolution, the temporal corporate knowledge graph, and governed professional context;\n- lot `22`: conditional, premium, LinkedIn, Discord, and BrixHub integrations;\n- lots `22–23`: conditional sources and governed research orchestration;",
          )
          graph_gate = (
              "- corporate graph cannot import network clients, source adapters, browser automation, "
              "`neo4j`, or `networkx`, and its domain cannot depend on FastAPI, SQLAlchemy, "
              "infrastructure implementations, or opportunity modules."
          )
          professional_gate = (
              "- professional context cannot import network clients, browser or platform automation, "
