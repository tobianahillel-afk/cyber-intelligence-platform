version: 1

sources:
  - source_id: marginalia-web-search-metadata
    display_name: Marginalia Search API metadata
    category: corporate_public_footprint
    disposition: blocked
    activation_wave: SA15-L06
    requires_schedule: false
    reason: >-
      Production adapter and response contract are present, but a legitimate commercial API key,
      commercial-use entitlement evidence, Provider Onboarding secret reference and exact
      authorization record are not present. The shared public development key is not an acceptable
      production credential or live-test proof. Recheck when those prerequisites are provisioned;
      acceptance requires the production adapter to execute a controlled real-endpoint search and
      then pass exact-head CI/live validation before adding live_tested.
    stages: [catalogued, reviewed, mapped, adapter_present]

  - source_id: google-search-governed-route
    display_name: Google Search governed route resolution
    category: corporate_public_footprint
    disposition: blocked
    activation_wave: SA15-C3
    requires_schedule: false
    reason: >-
      The route-resolution contract is present and fail-closed. Custom Search JSON API may only be
      enabled for a deployment with recorded existing-customer entitlement plus secret references.
      Browser automation may only be enabled when explicit provider-permission evidence is recorded;
      CAPTCHA and anti-bot bypass remain forbidden. Otherwise C3 requires a demonstrably equivalent
      canonical search provider with real normalized-SERP live proof. Analyst-opened Google search
      links remain available but do not count as automated live proof.
    stages: [catalogued, reviewed, mapped, contract_present]
