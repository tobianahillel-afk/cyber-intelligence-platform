version: 1
reviewed_at: 2026-08-09

sources:
  - id: sec-cyber-disclosures
    name: SEC public cybersecurity incident disclosures
    base_url: https://data.sec.gov/submissions/
    status: enabled
    source_type: api
    owner: U.S. Securities and Exchange Commission
    terms_url: https://www.sec.gov/about/privacy-information
    licence: SEC public data and fair-access policy
    allowed_data_categories: &allowed [public_incident_metadata]
    prohibited_data_categories: &prohibited
      - credential
      - victim_file
      - private_communication
      - private_personal_data
      - restricted_content
    rate_limit_per_minute: 10
    retention_days: 3650
    attribution_required: true
    raw_content_storage: false
    human_review_required: false
    authorization:
      status: approved
      document_reference: docs/source_activation/SA_04_PROVIDER_AUTHORIZATION.md#sec-edgar-cybersecurity-disclosures
      reviewed_at: "2026-08-09T23:20:00+00:00"
      expires_at: null
      approved_hosts: [data.sec.gov]
      approved_path_prefixes: [/submissions/]
      approved_purposes: [incident-intelligence]
      automated_collection_allowed: true
      raw_storage_allowed: false
    economics: &public_economics
      commercial_value: high
      monthly_cost: 0
      implementation_cost: medium
      maintenance_cost: medium
      expected_stability: high
    notes: >-
      Targeted submissions metadata only for explicitly enabled CIKs. Runtime requires
      a descriptive deployment User-Agent. SA-04 filters non-amended Item 1.05 forms
      and does not download filing narratives or enumerate the global issuer corpus.

  - id: official-company-incident-disclosures
    name: Authorized public company incident disclosures
    base_url: https://example.invalid/company-incidents/
    status: draft
    source_type: api
    owner: Deployment-specific approved company disclosure sources
    terms_url: https://example.invalid/terms
    licence: Deployment-specific public source terms
    allowed_data_categories: *allowed
    prohibited_data_categories: *prohibited
    rate_limit_per_minute: 10
    retention_days: 3650
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: &missing_authorization
      status: missing
      document_reference: null
      reviewed_at: null
      expires_at: null
      approved_hosts: []
      approved_path_prefixes: []
      approved_purposes: []
      automated_collection_allowed: false
      raw_storage_allowed: false
    economics: *public_economics
    notes: >-
      Schema-only placeholder. A real company or filing source requires an exact
      reviewed target registry and authorization before an adapter or schedule exists.

  - id: regulator-cert-incident-notices
    name: Authorized regulator and CERT incident notices
    base_url: https://example.invalid/regulator-cert-incidents/
    status: draft
    source_type: api
    owner: Deployment-specific regulator or CERT sources
    terms_url: https://example.invalid/terms
    licence: Deployment-specific public source terms
    allowed_data_categories: *allowed
    prohibited_data_categories: *prohibited
    rate_limit_per_minute: 10
    retention_days: 3650
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: *missing_authorization
    economics: *public_economics
    notes: >-
      Only public notices may be considered. Reports submitted privately to a regulator,
      restricted portals, case files, and personal victim data are excluded.

  - id: licensed-incident-reporting
    name: Licensed public incident reporting and research
    base_url: https://example.invalid/licensed-incident-reporting/
    status: draft
    source_type: api
    owner: Deployment-specific licensed reporting provider
    terms_url: https://example.invalid/terms
    licence: Contract required
    allowed_data_categories: *allowed
    prohibited_data_categories: *prohibited
    rate_limit_per_minute: 10
    retention_days: 1825
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: *missing_authorization
    economics:
      commercial_value: medium
      monthly_cost: 0
      implementation_cost: medium
      maintenance_cost: medium
      expected_stability: medium
    notes: >-
      Syndicated reports must share one independence key. Full article mirroring,
      private newsletters, credentials, and personal data are not permitted.

  - id: licensed-ransomware-metadata
    name: Licensed public ransomware claim metadata
    base_url: https://example.invalid/ransomware-metadata/
    status: draft
    source_type: api
    owner: Deployment-specific licensed metadata provider
    terms_url: https://example.invalid/terms
    licence: Contract required
    allowed_data_categories: *allowed
    prohibited_data_categories: *prohibited
    rate_limit_per_minute: 10
    retention_days: 1825
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: *missing_authorization
    economics:
      commercial_value: medium
      monthly_cost: 0
      implementation_cost: high
      maintenance_cost: high
      expected_stability: low
    notes: >-
      Provider-hosted metadata only. Threat-actor portals, onion URLs, screenshots,
      victim files, leaked samples, stolen data, negotiation messages, credentials,
      and direct interaction are prohibited. Every record remains an allegation until
      independently and officially confirmed.
