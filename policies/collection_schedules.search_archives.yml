version: 1

schedules:
  - source_id: brave-search-api
    adapter_id: brave-web-search
    enabled: false
    interval_seconds: 86400
    lease_seconds: 180
    retry:
      max_attempts: 3
      base_delay_seconds: 300
      max_delay_seconds: 3600
      circuit_failure_threshold: 3
      circuit_reset_seconds: 3600

  - source_id: internet-archive-cdx
    adapter_id: internet-archive-cdx
    enabled: true
    interval_seconds: 604800
    lease_seconds: 180
    retry:
      max_attempts: 3
      base_delay_seconds: 300
      max_delay_seconds: 3600
      circuit_failure_threshold: 3
      circuit_reset_seconds: 3600

  - source_id: common-crawl-index
    adapter_id: common-crawl-cdxj-index
    enabled: true
    interval_seconds: 604800
    lease_seconds: 180
    retry:
      max_attempts: 3
      base_delay_seconds: 600
      max_delay_seconds: 7200
      circuit_failure_threshold: 3
      circuit_reset_seconds: 14400

  - source_id: github-code-search-metadata
    adapter_id: github-rest-code-search
    enabled: false
    interval_seconds: 86400
    lease_seconds: 180
    retry:
      max_attempts: 2
      base_delay_seconds: 900
      max_delay_seconds: 7200
      circuit_failure_threshold: 2
      circuit_reset_seconds: 7200

  - source_id: crossref-publication-metadata
    adapter_id: crossref-ror-works
    enabled: false
    interval_seconds: 604800
    lease_seconds: 180
    retry:
      max_attempts: 3
      base_delay_seconds: 600
      max_delay_seconds: 7200
      circuit_failure_threshold: 3
      circuit_reset_seconds: 7200

  - source_id: patentsview-patent-metadata
    adapter_id: patentsview-assignee-patents
    enabled: false
    interval_seconds: 604800
    lease_seconds: 180
    retry:
      max_attempts: 2
      base_delay_seconds: 1800
      max_delay_seconds: 14400
      circuit_failure_threshold: 2
      circuit_reset_seconds: 14400

  - source_id: w3c-affiliation-specification-metadata
    adapter_id: w3c-affiliation-specifications
    enabled: false
    interval_seconds: 604800
    lease_seconds: 180
    retry:
      max_attempts: 3
      base_delay_seconds: 600
      max_delay_seconds: 7200
      circuit_failure_threshold: 3
      circuit_reset_seconds: 7200

  - source_id: mojeek-web-search-metadata
    adapter_id: mojeek-web-search
    enabled: false
    interval_seconds: 86400
    lease_seconds: 180
    retry:
      max_attempts: 2
      base_delay_seconds: 900
      max_delay_seconds: 7200
      circuit_failure_threshold: 2
      circuit_reset_seconds: 7200
