sources:
  - id: official-corporate-disclosures
    name: Official corporate disclosures
    base_url: https://example.invalid/corporate-disclosures/
    status: draft
    source_type: api
    owner: Deployment-specific official filing and company disclosure providers
    terms_url: https://example.invalid/terms
    licence: Review required
    allowed_data_categories: &allowed
      - organization_metadata
      - public_incident_metadata
      - public_result_metadata
    prohibited_data_categories: &prohibited
      - credential
      - victim_file
      - private_communication
      - private_personal_data
      - restricted_content
    rate_limit_per_minute: 10
    retention_days: 1825
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: &missing_authorization
      status: missing
      document_reference: null
      reviewed_at: null
      expires_at: null
      approved_hosts: []
      approved_path_prefixes: []
      approved_purposes: []
      automated_collection_allowed: false
      raw_storage_allowed: false
    economics: &candidate_economics
      commercial_value: high
      monthly_cost: 0
      implementation_cost: medium
      maintenance_cost: medium
      expected_stability: medium
    notes: >-
      Official filing and company-disclosure metadata only. Collection is not
      authorized by this catalog entry. Full article bodies, private documents,
      credentials, contact enrichment, and autonomous outreach are out of scope.

