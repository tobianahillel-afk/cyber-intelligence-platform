version: 1
reviewed_at: 2026-08-11

sources:
  - id: brave-search-api
    name: Brave Search API
    base_url: https://api.search.brave.com/res/v1/web/search
    status: enabled
    source_type: search_provider
    owner: Brave Software
    terms_url: https://brave.com/search/api/terms-of-service/
    licence: Brave Search API subscription terms
    allowed_data_categories: [public_result_metadata]
    prohibited_data_categories: &prohibited
      - credential
      - victim_file
      - private_communication
      - private_personal_data
      - restricted_content
    rate_limit_per_minute: 10
    retention_days: 90
    attribution_required: true
    raw_content_storage: false
    human_review_required: false
    authorization:
      status: approved
      document_reference: docs/source_activation/SA_02_PROVIDER_AUTHORIZATION.md#brave-search-api
      reviewed_at: "2026-08-09T16:45:00+00:00"
      expires_at: null
      approved_hosts: [api.search.brave.com]
      approved_path_prefixes: [/res/v1/web/search]
      approved_purposes: [corporate-public-footprint]
      automated_collection_allowed: true
      raw_storage_allowed: false
    economics:
      commercial_value: high
      monthly_cost: 0
      implementation_cost: medium
      maintenance_cost: medium
      expected_stability: medium
    notes: >-
      Execution additionally requires connected Provider Onboarding with a reviewed subscription
      whose storage/use rights permit the bounded normalized result metadata retained by CIP.

