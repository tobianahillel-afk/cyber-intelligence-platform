  - id: w3c-affiliation-specification-metadata
    name: W3C affiliation standards metadata
    base_url: https://api.w3.org/affiliations
    status: enabled
    source_type: api
    owner: World Wide Web Consortium (W3C)
    terms_url: https://www.w3.org/api/
    licence: Public W3C API metadata; read-only JSON/HAL access
    allowed_data_categories: [public_result_metadata]
    prohibited_data_categories: *prohibited
    rate_limit_per_minute: 10
    retention_days: 180
    attribution_required: true
    raw_content_storage: false
    human_review_required: false
    authorization:
      status: approved
      document_reference: docs/source_activation/SA_14_W3C_STANDARDS.md
      reviewed_at: "2026-08-11T14:05:00+00:00"
      expires_at: null
      approved_hosts: [api.w3.org]
      approved_path_prefixes:
        - /affiliations
        - /groups
      approved_purposes: [standards-discovery]
      automated_collection_allowed: true
      raw_storage_allowed: false
    economics:
      commercial_value: medium
      monthly_cost: 0
      implementation_cost: medium
      maintenance_cost: low
      expected_stability: high
    notes: >-
      Public read-only W3C API metadata scoped to explicitly configured affiliation IDs. CIP
      revalidates the provider affiliation name before following public group participation links
      and retains only affiliation identity, group type/shortname and specification shortname/title
      plus a safe W3C metadata/document URL. Participants, users, chairs, team contacts, editors,
      specification versions and specification bodies are never retrieved by this adapter. Group
      participation is quarantined discovery metadata, not proof of authorship, ownership,
      deployment, cyber need, commercial opportunity or outreach authorization.

