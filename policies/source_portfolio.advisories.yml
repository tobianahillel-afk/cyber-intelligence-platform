version: 1

sources:
  - source_id: official-vendor-psirt
    display_name: Official Vendor PSIRT Advisories
    canonical_url: https://example.invalid/vendor-psirt/
    category: vulnerability_advisory
    status: candidate
    freshness_max_age_seconds: 21600
    commercial_use_cases: &use_cases
      - vulnerability_applicability
      - product_lifecycle_context
      - remediation_context
    candidate_origin: lot-17
    monthly_cost_limit: 0
    metadata: &disabled_metadata
      executable: false
      authorization_status: missing
      active_probe: forbidden
      credential_use: forbidden
      access_control_bypass: forbidden
      exposure_verification: forbidden
      organization_compromise_inference: forbidden
      automatic_opportunity: forbidden
      autonomous_outreach: forbidden
    adapter:
      adapter_id: official-vendor-psirt
      adapter_version: "1"
      provider_schema_version: vendor-advisory-metadata-v1
      modes: &modes
        - historical_backfill
        - incremental_cursor
        - conditional_refresh
      canonical_output_types: &outputs
        - vendor_product
        - vendor_advisory_revision
        - affected_version_range
        - vulnerability_applicability_assessment
      supports_corrections: true
      supports_tombstones: true
      supports_retractions: true
      max_page_size: 100
      max_window_days: 30
      cost_per_request: 0

