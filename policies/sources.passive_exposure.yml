version: 1
reviewed_at: 2026-08-06

sources:
  - id: licensed-passive-exposure
    name: Licensed passive asset observation metadata
    base_url: https://example.invalid/passive-exposure/
    status: draft
    source_type: api
    owner: Deployment-specific passive exposure provider
    terms_url: https://example.invalid/terms
    licence: Contract required
    allowed_data_categories: &allowed
      - technology_observation
    prohibited_data_categories: &prohibited
      - credential
      - victim_file
      - private_communication
      - private_personal_data
      - restricted_content
    rate_limit_per_minute: 10
    retention_days: 1095
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: &missing_authorization
      status: missing
      document_reference: null
      reviewed_at: null
      expires_at: null
      approved_hosts: []
      approved_path_prefixes: []
      approved_purposes: []
      automated_collection_allowed: false
      raw_storage_allowed: false
    economics: &licensed_economics
      commercial_value: medium
      monthly_cost: 0
      implementation_cost: medium
      maintenance_cost: medium
      expected_stability: medium
    notes: >-
      Provider-published passive hostname, IP, DNS, ASN, certificate, port, and
      service metadata only. No active lookup, probe, connection, authentication,
      scan, exploitation, or prospect validation is authorized.

  - id: licensed-technographic-observations
    name: Licensed passive technographic observations
    base_url: https://example.invalid/technographic-observations/
    status: draft
    source_type: api
    owner: Deployment-specific technographic provider
    terms_url: https://example.invalid/terms
    licence: Contract required
    allowed_data_categories: *allowed
    prohibited_data_categories: *prohibited
    rate_limit_per_minute: 10
    retention_days: 730
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: *missing_authorization
    economics: *licensed_economics
    notes: >-
      Product, component, service, and version metadata from a passive provider only.
      A product mention is not proof of deployment, an observed version is not a
      vulnerability-applicability decision, and no exposure is verified.

  - id: licensed-cloud-asset-observations
    name: Licensed passive cloud and infrastructure observations
    base_url: https://example.invalid/cloud-asset-observations/
    status: draft
    source_type: api
    owner: Deployment-specific cloud metadata provider
    terms_url: https://example.invalid/terms
    licence: Contract required
    allowed_data_categories: *allowed
    prohibited_data_categories: *prohibited
    rate_limit_per_minute: 10
    retention_days: 730
    attribution_required: true
    raw_content_storage: false
    human_review_required: true
    authorization: *missing_authorization
    economics: *licensed_economics
    notes: >-
      Provider-qualified cloud-resource and public infrastructure metadata only.
      Shared tenancy, reseller, subsidiary, CDN, reassignment, and abandoned-domain
      risks require review. Credentials and authenticated cloud enumeration are
      prohibited.
