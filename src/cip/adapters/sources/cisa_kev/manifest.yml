id: cisa-kev-feed
source_id: cisa-kev
adapter_version: 1
acquisition_mode: feed
preferred_schedule: PT15M
supports_incremental: true
checkpoint_fields:
  - etag
  - last_modified
  - catalog_version
network:
  allowed_hosts:
    - www.cisa.gov
  allowed_paths:
    - /sites/default/files/feeds/known_exploited_vulnerabilities.json
limits:
  requests_per_minute: 6
  concurrent_jobs: 1
  max_response_bytes: 20000000
  timeout_seconds: 30
storage:
  raw_content: false
  normalized_observations: true
